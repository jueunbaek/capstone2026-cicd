services:
  db:
    image: mariadb:latest
    container_name: yj-db
    restart: always
    environment:
      MARIADB_ROOT_PASSWORD: "1234"
      MARIADB_DATABASE: user_db
    ports:
      - "3316:3306"

  backend:
    environment:
      - SPRING_PROFILES_ACTIVE=docker
    build: ./backend
    container_name: yj-backend
    ports:
      - "8080:8080"
    depends_on:
      - db

  frontend:
    build: ./frontend
    container_name: yj-frontend
    ports:
      - "63342:80"
    depends_on:
      - backend
